# DeepFake Detection System Configuration (Cross-Platform MLOps Config)

# Cross-Platform Storage & Path Resolution
paths:
  data_dir: "data"                           # Relative to project root
  local_output_dir: "outputs"                 # Relative to project root on Local CPU
  colab_output_dir: "/content/drive/MyDrive/DeepFake_Outputs" # Google Drive on Colab
  features_filename: "extracted_features.npz"
  model_filename: "attention_adapter.pth"
  roc_plot_filename: "roc_curve.png"

# Video Sampling & Preprocessing
video:
  target_fps: 3.0              # Set to 3.0 FPS for memory safety on CPU
  max_frames: 60               # Cap max frames to prevent RAM overflow
  spatial_size: [224, 224]     # Standard image input size for visual encoder
  face_crop_margin: 0.2        # Bounding box expansion margin around detected face
  roi_margin: 0.15             # Margin around facial feature ROIs

# Pretrained Models & Landmark Detection
landmarks:
  model_url: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
  model_filename: "face_landmarker.task"
  num_faces: 1
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5

# Visual Feature Extraction
visual_encoder:
  backbone: "efficientnet_b0"  # EfficientNet-B0 frozen visual backbone
  pretrained: true
  freeze_weights: true
  roi_image_size: [112, 112]
  batch_size: 16

# Biomechanics Feature Parameters
biomechanics:
  smoothing_window: 7
  poly_order: 2
  normalize_scale: true
  compute_derivatives:
    - displacement
    - velocity
    - acceleration
    - jerk

# Physiological rPPG Parameters
rppg:
  algorithm: "POS"             # Default algorithm: POS
  fps: 3.0
  low_cutoff_hz: 0.7           # ~42 BPM
  high_cutoff_hz: 3.5          # ~210 BPM
  filter_order: 4
  skin_rois:
    - forehead
    - left_cheek
    - right_cheek

# Classifier Settings: PEFT PyTorch Anatomical Adapter
classifier:
  type: "pytorch_adapter"
  pytorch_adapter_params:
    hidden_dim: 256
    proj_dim: 128
    dropout: 0.3
    epochs: 30
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001

# Hardware & System Config
hardware:
  device: "auto"               # Auto-detect CUDA vs CPU dynamically
  num_workers: 0               # Thread safety across OS environments
